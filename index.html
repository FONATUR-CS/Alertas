<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de alertas de Fonatur - Comunicación Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-news { font-family: 'Playfair Display', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b231e; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #bd9751; border-radius: 10px; }
        .hidden { display: none !important; }
        .progress-container { width: 100%; height: 6px; background: rgba(189, 151, 81, 0.1); border-radius: 10px; overflow: hidden; margin-top: 1rem; }
        .progress-bar { height: 100%; background: #bd9751; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(189, 151, 81, 0.5); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@0.21.0"
      }
    }
    </script>
</head>
<body class="bg-[#05110e] text-gray-100 min-h-screen flex overflow-hidden">
    <aside class="w-80 bg-[#0b231e] border-r border-[#1a3d35] flex flex-col hidden lg:flex shrink-0">
        <div class="p-6 border-b border-[#1a3d35] flex justify-between items-center">
            <div class="flex items-center gap-2 text-[#bd9751]">
                <i data-lucide="history" class="w-5 h-5"></i>
                <h2 class="font-semibold uppercase tracking-wider text-xs">Historial</h2>
            </div>
            <button id="btn-clear-history" class="text-gray-500 hover:text-[#bd9751] transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
            <div id="history-empty" class="text-center py-10 text-gray-600">
                <p class="text-sm">Sin alertas previas</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#05110e] h-screen">
        <header class="h-24 shrink-0 flex items-center justify-between px-8 border-b border-[#1a3d35] bg-[#0b231e]/90 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-[#bd9751] rounded flex items-center justify-center shadow-lg shadow-black/40">
                    <i data-lucide="shield-check" class="text-[#0b231e] w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white uppercase">FONATUR <span class="text-[#bd9751]">Alertas</span></h1>
                    <p class="text-[10px] text-[#bd9751] font-bold uppercase tracking-[0.3em]">Comunicación Social</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="btn-training" class="p-2 text-gray-400 hover:text-[#bd9751] transition-colors"><i data-lucide="book-open-check" class="w-5 h-5"></i></button>
                <button id="btn-settings" class="p-2 text-gray-400 hover:text-[#bd9751] transition-colors"><i data-lucide="key" class="w-5 h-5"></i></button>
                <button id="btn-record" class="flex items-center gap-2 bg-white text-[#0b231e] hover:bg-[#bd9751] px-6 py-2.5 rounded font-bold transition-all"><i data-lucide="mic" class="w-4 h-4"></i><span class="text-sm">GRABAR</span></button>
                <button id="btn-stop" class="hidden flex items-center gap-2 bg-[#bd9751] text-[#0b231e] px-5 py-2.5 rounded font-bold animate-pulse"><i data-lucide="square" class="w-4 h-4"></i><span class="text-sm">DETENER</span></button>
                <label class="cursor-pointer bg-[#13322b] p-2.5 rounded border border-[#bd9751]/30 text-[#bd9751] hover:bg-[#1a3d35]">
                    <i data-lucide="upload" class="w-5 h-5"></i>
                    <input type="file" id="file-input" class="hidden" accept="audio/*,video/*">
                </label>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-8 flex flex-col items-center">
            <div id="error-banner" class="hidden w-full max-w-2xl bg-red-950/90 border border-red-900/50 p-4 rounded mb-6 flex items-center gap-3 text-red-400">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <p id="error-message" class="text-sm font-medium"></p>
            </div>

            <div id="empty-state" class="py-40 text-center">
                <h2 class="text-2xl font-news text-gray-200 italic">Buzón Institucional</h2>
                <p class="text-gray-500 text-sm mt-4">Suba un audio o inicie una grabación para comenzar.</p>
            </div>

            <div id="loading-state" class="hidden flex flex-col items-center py-24 w-full max-w-sm">
                <div class="w-16 h-16 border-4 border-[#bd9751]/20 border-t-[#bd9751] rounded-full animate-spin mb-8"></div>
                <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
                <div class="flex justify-between w-full mt-2 text-[10px] text-[#bd9751] font-bold uppercase">
                    <span id="progress-percentage">0%</span>
                    <span id="progress-status">Analizando audio</span>
                </div>
            </div>

            <div id="result-container" class="hidden w-full max-w-4xl bg-white text-[#0b231e] shadow-2xl rounded overflow-hidden flex flex-col mb-20">
                <div class="bg-[#f8f9fa] px-8 py-4 border-b border-gray-200 flex justify-between items-center sticky top-0">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-[#0b231e]">FONATUR • Comunicación Social</span>
                    <button id="btn-copy" class="bg-[#0b231e] text-white px-4 py-2 rounded text-xs font-bold transition-all active:scale-95">
                        <i data-lucide="copy" class="w-3.5 h-3.5 inline mr-1"></i><span id="btn-copy-text">COPIAR TEXTO</span>
                    </button>
                </div>
                <div class="p-12 md:p-16 font-serif text-lg leading-relaxed whitespace-pre-wrap selection:bg-[#bd9751]/20">
                    <div id="alert-content" class="max-w-2xl mx-auto font-news"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="training-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#0b231e] border border-[#1a3d35] rounded-lg w-full max-w-2xl p-6 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 text-[#bd9751]">
                <h3 class="font-bold uppercase tracking-wider">Estilo Institucional</h3>
                <button id="btn-close-training" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <textarea id="training-input" class="flex-1 bg-[#05110e] border border-[#1a3d35] text-white p-4 rounded font-mono text-sm resize-none h-64" placeholder="Pega ejemplos aquí..."></textarea>
            <div class="flex gap-2 mt-4">
                <button id="btn-save-training" class="flex-1 bg-[#bd9751] text-[#0b231e] px-6 py-2.5 rounded font-bold hover:bg-[#a68444]">GUARDAR</button>
                <button id="btn-export-training" class="p-2.5 border border-[#bd9751] text-[#bd9751] rounded hover:bg-[#bd9751]/10" title="Exportar Estilo">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <label class="p-2.5 border border-[#bd9751] text-[#bd9751] rounded cursor-pointer hover:bg-[#bd9751]/10" title="Importar Estilo">
                    <i data-lucide="upload" class="w-5 h-5"></i>
                    <input type="file" id="input-import-training" class="hidden" accept=".json">
                </label>
            </div>
        </div>
    </div>

    <div id="api-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-[#0b231e] border border-[#1a3d35] rounded-lg w-full max-w-md p-6">
            <h3 class="text-[#bd9751] font-bold mb-4 uppercase">API Key de Gemini</h3>
            <input type="password" id="api-key-input" placeholder="AIza..." class="w-full bg-[#05110e] border border-[#1a3d35] text-white p-3 rounded mb-4 focus:border-[#bd9751] outline-none">
            <button id="btn-save-key" class="w-full bg-[#bd9751] text-[#0b231e] py-2 rounded font-bold hover:bg-[#a68444]">GUARDAR</button>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
